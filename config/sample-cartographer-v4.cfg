# This file contains common pin mappings for the Cartographer board V4
# To use this config, the firmware should be compiled for the
# STM32G431 with "24 MHz crystal" and
# "USB (on PA11/PA12)" or "CAN bus (on PA11/PA12)".
# CAN bus requires PA3 GPIO pin to be set at micro-controller start-up
# The "carto" micro-controller will be used to control
# the components on the board.

# See docs/Config_Reference.md for a description of parameters.

[mcu carto]
serial: /dev/serial/by-id/usb-Klipper_stm32g431xx_29000380114330394D363620-if00
#canbus_uuid: 92cf532ef122

#[adxl345 carto]
#cs_pin: carto:PA0
#spi_bus: spi1_PA6_PA7_PA5
#axes_map: x,y,z

[thermistor 47k]
temperature1: 25
resistance1: 47000
beta: 4041

[temperature_probe carto]
pullup_resistor: 10000
sensor_type: 47k
sensor_pin: carto:PA4
min_temp: 0
max_temp: 125

[led carto_led]
white_pin: carto:PA15
initial_WHITE: 0.03

[output_pin _LDC1612_en]
pin: carto:PB4
value: 0 # enable

[static_pwm_clock ldc1612_clk_in]
pin: carto:PB6
frequency: 21250000

[probe_eddy_current carto]
sensor_type: ldc1612
frequency: 21250000
i2c_address: 42
i2c_mcu: carto
i2c_bus: i2c2_PA9_PA8
descend_z: 0.5
